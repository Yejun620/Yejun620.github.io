<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found | Yejun Lee</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23111'/%3E%3Ctext x='32' y='43' font-family='Arial' font-size='30' font-weight='800' text-anchor='middle' fill='%23fff'%3EYL%3C/text%3E%3C/svg%3E" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Absolute path: a 404 page is served from any URL, so relative paths would break -->
  <link rel="stylesheet" href="/css/style.css?v=5" />
</head>
<body>
  <main class="error-page">
    <div>
      <p class="error-code">404</p>
      <p class="error-text">This page doesn't exist or has moved.</p>
      <div class="hero-actions">
        <a href="/" class="btn btn-primary">Back to Home</a>
      </div>
    </div>
  </main>
</body>
</html>
